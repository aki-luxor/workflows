name: Corrected installation - Staging Tailscale and cache acceptance
on:
  push:
    branches: [pr6348-staging-tailnet-e2e-20261029]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  seed:
    runs-on: tenki-staging-standard-small-2c-4g
    timeout-minutes: 10
    outputs:
      key: ${{ steps.payload.outputs.key }}
      sha: ${{ steps.payload.outputs.sha }}
    steps:
      - name: Verify ordinary runner and host cache proxy
        run: |
          set -euo pipefail
          case "$RUNNER_NAME" in tenki-sandbox-*) ;; *) echo "Expected sandbox-backed staging runner"; exit 1;; esac
          case "$ACTIONS_RESULTS_URL" in *:49193/*) ;; *) echo "Tenki cache proxy missing"; exit 1;; esac
          test -z "${TS_AUTHKEY:-}${TAILSCALE_AUTHKEY:-}${TS_CLIENT_SECRET:-}"
          curl --fail --silent --max-time 20 --output /dev/null https://api.github.com
      - id: payload
        run: |
          mkdir -p .cache/pr6348
          head -c 1048576 /dev/urandom > .cache/pr6348/payload.bin
          echo "key=staging-pr6348-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          echo "sha=$(sha256sum .cache/pr6348/payload.bin | awk '{print $1}')" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/save@v4
        with:
          path: .cache/pr6348
          key: ${{ steps.payload.outputs.key }}
  restore:
    needs: seed
    runs-on: tenki-staging-standard-small-2c-4g
    timeout-minutes: 10
    steps:
      - uses: actions/cache/restore@v4
        with:
          path: .cache/pr6348
          key: ${{ needs.seed.outputs.key }}
          fail-on-cache-miss: true
      - run: echo "${{ needs.seed.outputs.sha }}  .cache/pr6348/payload.bin" | sha256sum -c -
  packages:
    needs: seed
    runs-on: tenki-staging-standard-small-2c-4g
    timeout-minutes: 10
    steps:
      - name: Verify npm proxy and package bytes
        run: |
          set -euo pipefail
          registry=$(npm config get registry)
          echo "npm registry: $registry"
          case "$registry" in http://ci.cache.tenki.cloud:6990/ci/npm*) ;; *) echo "Tenki npm proxy not configured"; exit 1;; esac
          npm view is-number@7.0.0 version --fetch-timeout=20000 --fetch-retries=1
          mkdir -p "$RUNNER_TEMP/pr6348-npm"
          cd "$RUNNER_TEMP/pr6348-npm"
          npm pack is-number@7.0.0 --cache "$RUNNER_TEMP/pr6348-empty-cache" --fetch-timeout=20000 --fetch-retries=1
          tar -xzf is-number-7.0.0.tgz
          node -e "const p=require('./package/package.json'); if(p.name!=='is-number'||p.version!=='7.0.0')process.exit(1); console.log('npm package verified')"
      - name: Verify Go proxy
        run: |
          set -euo pipefail
          proxy=$(go env GOPROXY)
          echo "Go proxy: $proxy"
          case "$proxy" in http://ci.cache.tenki.cloud:6990/ci/go*) ;; *) echo "Tenki Go proxy not configured"; exit 1;; esac
          GOMODCACHE="$RUNNER_TEMP/pr6348-go" go mod download github.com/google/uuid@v1.6.0
      - name: Verify Docker mirror
        run: |
          set -euo pipefail
          docker info --format '{{json .RegistryConfig.Mirrors}}'
          docker info --format '{{json .RegistryConfig.Mirrors}}' | grep -F ci.cache.tenki.cloud
          docker pull alpine:3.21
